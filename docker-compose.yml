services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gfl
      POSTGRES_USER: gfl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gfl_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gfl -d gfl"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gfl:${POSTGRES_PASSWORD:-gfl_dev}@db:5432/gfl
      JWT_SECRET: ${JWT_SECRET:-cambiar-este-secreto-en-produccion}
      TZ_NEGOCIO: ${TZ_NEGOCIO:-America/Argentina/Buenos_Aires}
      PORT: 4000
      CORS_ORIGIN: http://localhost:${APP_PORT:-4000}
      STORAGE_DIR: /data/storage
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:
